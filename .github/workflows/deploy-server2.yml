# =============================================
# GitHub Actions - 自动部署到 Server 2
# 触发条件：push 到 main 分支
# =============================================

name: Deploy to Server 2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/soulmate-ai

            echo ">>> 拉取最新代码..."
            git fetch origin main
            LOCAL=$(git rev-parse HEAD)
            REMOTE=$(git rev-parse origin/main)
            if [ "$LOCAL" = "$REMOTE" ]; then
              echo ">>> 代码已是最新，跳过部署"
              exit 0
            fi

            git reset --hard origin/main

            echo ">>> 构建 Docker 镜像..."
            docker compose -f docker-compose.server2.yml --env-file .env.server2 build --no-cache

            echo ">>> 重启服务..."
            docker compose -f docker-compose.server2.yml --env-file .env.server2 down
            docker compose -f docker-compose.server2.yml --env-file .env.server2 up -d

            echo ">>> 等待服务启动..."
            sleep 15

            RETRIES=12
            while [ $RETRIES -gt 0 ]; do
              if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo ">>> 部署成功!"
                exit 0
              fi
              RETRIES=$((RETRIES - 1))
              echo ">>> 等待服务就绪... (剩余 $RETRIES 次)"
              sleep 5
            done

            echo ">>> 服务启动超时!"
            docker compose -f docker-compose.server2.yml logs --tail=50 soulmate-app
            exit 1
