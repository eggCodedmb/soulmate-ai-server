# =============================================
# SoulMate AI - 本地开发环境（完整）
# 用途：PostgreSQL + Redis + 应用 + Nginx
# 命令：
#   仅基础设施：docker compose --profile infra up -d
#   完整部署：docker compose up -d
# =============================================

services:
  # ==================== 基础设施 ====================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: soulmate-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: soulmate
      POSTGRES_USER: soulmate
      POSTGRES_PASSWORD: soulmate2026
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soulmate"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soulmate-dev-net

  redis:
    image: redis:7-alpine
    container_name: soulmate-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass soulmate2026
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "soulmate2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soulmate-dev-net

  # ==================== 后端应用 ====================

  soulmate-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soulmate-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # 数据库
      DB_URL: jdbc:postgresql://postgres:5432/soulmate
      DB_USERNAME: soulmate
      DB_PASSWORD: soulmate2026
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: soulmate2026
      # JWT
      JWT_SECRET: ${JWT_SECRET:-soulmate-jwt-secret-key-2026-change-in-production}
      # AI (MiMo)
      MIMO_API_KEY: ${MIMO_API_KEY}
      MIMO_BASE_URL: ${MIMO_BASE_URL:-https://api.xiaomimimo.com/v1}
      # 邮件
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # JVM
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC"
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      - D:/opt/soulmate-ai/models/e5-small-v2:/models/e5-small-v2:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - soulmate-dev-net

  # ==================== Nginx 反向代理 ====================

  nginx:
    image: nginx:alpine
    container_name: soulmate-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - app_data:/app/data:ro
    depends_on:
      - soulmate-app
    networks:
      - soulmate-dev-net

volumes:
  postgres_dev_data:
  redis_dev_data:
  app_data:
  app_logs:

networks:
  soulmate-dev-net:
    driver: bridge
