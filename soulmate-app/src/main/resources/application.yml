server:
  port: 8080

spring:
  application:
    name: soulmate-ai

  # 虚拟线程（Java 21）
  threads:
    virtual:
      enabled: true

  # 数据源
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000

  # Redis
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # 文件上传
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # 邮件服务
  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Spring AI 配置（mimo-v2.5-pro，OpenAI 兼容 API）
  ai:
    openai:
      api-key: ${MIMO_API_KEY}
      base-url: ${MIMO_BASE_URL}
      chat:
        model: mimo-v2.5-pro
        max-tokens: 2048
        temperature: 0.7
    embedding:
      transformer:
        onnx:
          modelUri: file:///D:/Code/models/e5-small-v2/model.onnx
        tokenizer:
          uri: file:///D:/Code/models/e5-small-v2/tokenizer.json
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST}
          port: ${MILVUS_PORT}
        collection-name: memory_vectors
        embedding-dimension: 384
        index-type: IVF_FLAT
        metric-type: COSINE
        initialize-schema: true

# MyBatis-Plus
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

# SoulMate 自定义配置
soulmate:
  jwt:
    secret: ${JWT_SECRET}
    expire-ms: 604800000  # 7天

  ai:
    default-model: mimo-v2.5-pro
    base-url: ${MIMO_BASE_URL}
    api-key: ${MIMO_API_KEY}
    asr:
      enabled: true
      model: mimo-v2.5-asr
      base-url: ${MIMO_BASE_URL}
      max-size-mb: 25

  # 和风天气配置
  qweather:
    api-key: ${QWEATHER_API_KEY}
    api-host-url: ${QWEATHER_API_HOST}
  # 文件上传配置
  file:
    base-dir: D:/Code/soulmate-ai-server/online
    allowed-types: jpg,jpeg,png,gif,webp,bmp,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,mp3,mp4,wav
    max-size-mb: 10
    url-prefix: /files

  # 支付宝沙箱配置
  alipay:
    app-id: ${ALIPAY_APP_ID}
    private-key: ${ALIPAY_PRIVATE_KEY}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY}
    gateway: https://openapi-sandbox.dl.alipaydev.com/gateway.do
    notify-url: ${ALIPAY_NOTIFY_URL}
    return-url: ${ALIPAY_RETURN_URL}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# 日志
logging:
  level:
    "[com.soulmate]": DEBUG
    "[org.springframework.ai]": DEBUG
    "[org.springframework.web.client]": DEBUG
    "[org.apache.hc.client5]": INFO
