server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: soulmate-ai

  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.vectorstore.transformer.TransformersEmbeddingModelAutoConfiguration
      - org.springframework.ai.autoconfigure.transformers.TransformersEmbeddingModelAutoConfiguration
      - org.springframework.ai.model.transformers.autoconfigure.TransformersEmbeddingModelAutoConfiguration

  # 虚拟线程（Java 21）
  threads:
    virtual:
      enabled: true

  # 数据源（优先使用 DB_URL，若无则由 POSTGRES_HOST/POSTGRES_PORT/POSTGRES_DB 拼接）
  datasource:
    url: ${DB_URL:jdbc:postgresql://${POSTGRES_HOST:154.209.5.177}:${POSTGRES_PORT:5432}/${POSTGRES_DB:soulmate}}
    username: ${DB_USERNAME:${POSTGRES_USER:soulmate}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:soulmate2026}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:154.209.5.177}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:soulmate2026}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # 文件上传
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # 邮件服务
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Spring AI 配置（mimo-v2.5-pro，OpenAI 兼容 API）
  ai:
    openai:
      api-key: ${MIMO_API_KEY:}
      base-url: ${MIMO_BASE_URL:https://api.xiaomimimo.com/v1}
      chat:
        model: ${MIMO_MODEL:mimo-v2.5-pro}
        max-tokens: 2048
        temperature: 0.7
      embedding:
        enabled: true
        base-url: ${SILICONFLOW_EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
        api-key: ${SILICONFLOW_EMBEDDING_API_KEY:sk-lmiboizesdzsflmfcskasmeemhwdmmbrirpcwubevcraacji}
        options:
          model: ${SILICONFLOW_EMBEDDING_MODEL:BAAI/bge-large-zh-v1.5}
    vectorstore:
      pgvector:
        table-name: memory_vectors
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE

# MyBatis-Plus
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

# SoulMate 自定义配置
soulmate:
  jwt:
    secret: ${JWT_SECRET:soulmate-jwt-secret-key-2026-change-in-production}
    expire-ms: ${JWT_EXPIRE_MS:604800000}  # 7天

  ai:
    default-model: ${MIMO_MODEL:mimo-v2.5-pro}
    call-model: ${MIMO_CALL_MODEL:mimo-v2.5-flash}
    base-url: ${MIMO_BASE_URL:https://api.xiaomimimo.com/v1}
    api-key: ${MIMO_API_KEY:}
    asr:
      enabled: true
      model: ${MIMO_ASR_MODEL:mimo-v2.5-asr}
      base-url: ${MIMO_BASE_URL:https://api.xiaomimimo.com/v1}
      max-size-mb: 25

  # 和风天气配置
  qweather:
    api-key: ${QWEATHER_API_KEY:}
    api-host-url: ${QWEATHER_API_HOST:https://devapi.qweather.com}
  # 文件上传配置
  file:
    base-dir: ${FILE_BASE_DIR:./data/uploads}
    allowed-types: jpg,jpeg,png,gif,webp,bmp,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,mp3,mp4,wav
    max-size-mb: 10
    url-prefix: /files

  # 支付宝沙箱配置
  alipay:
    app-id: ${ALIPAY_APP_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
    gateway: ${ALIPAY_GATEWAY:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
    notify-url: ${ALIPAY_NOTIFY_URL:}
    return-url: ${ALIPAY_RETURN_URL:}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

# 日志
logging:
  level:
    "[com.soulmate]": DEBUG
    "[org.springframework.ai]": DEBUG
    "[org.springframework.web.client]": DEBUG
    "[org.apache.hc.client5]": INFO
